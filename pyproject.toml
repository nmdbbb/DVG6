[project]
name = "qtdl-warehouse"
version = "0.1.0"
description = "PostgreSQL warehouse + web dashboard cho môn Quản trị dữ liệu"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ingestion
    "httpx>=0.27",
    "polars>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    # transform
    "dbt-core>=1.10,<1.12",
    "dbt-postgres>=1.9,<1.11",
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Ghim chính xác: CI đọc hai dòng này, nên máy local, image Docker và CI cùng một bộ format.
    "ruff==0.16.10",
    "black==25.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["transform/target", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Độ dài dòng do black lo; chuỗi SQL/tiếng Việt được phép dài hơn.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Idiom của FastAPI: Depends()/Query() làm giá trị mặc định là đúng.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "transform/target|web"

[tool.pytest.ini_options]
testpaths = ["api/tests", "ingestion/tests", "mock_server/tests"]
